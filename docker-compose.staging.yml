x-staging-environment: &staging-environment
  APP_KEY: ${STAGING_APP_KEY:?STAGING_APP_KEY is required}
  APP_ENV: staging
  APP_DEBUG: "false"
  APP_URL: ${STAGING_APP_URL:?STAGING_APP_URL must be the approved staging origin}
  APP_IMAGE: ${APP_IMAGE:?APP_IMAGE must be an immutable GHCR tag@digest}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${STAGING_DB_DATABASE:-laraveldji_staging_restore}
  DQ_STAGING_DATABASE: ${STAGING_DB_DATABASE:-laraveldji_staging_restore}
  DB_USERNAME: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME is required}
  DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required}
  PROTECTED_DATABASE_NAMES: ${STAGING_PROTECTED_DATABASE_NAMES:?STAGING_PROTECTED_DATABASE_NAMES must include every production database}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: lax
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PREFIX: ${STAGING_REDIS_PREFIX:-laraveldji_staging_}
  BROADCAST_CONNECTION: ${STAGING_BROADCAST_CONNECTION:-log}
  MAIL_MAILER: log
  FILESYSTEM_DISK: local
  DOCUMENT_STORAGE_DISK: local
  EMPLOYEE_DOCUMENT_STORAGE_DISK: local
  TRUSTED_PROXIES: ${STAGING_TRUSTED_PROXIES:-127.0.0.1,::1}
  LOG_CHANNEL: production
  LOG_LEVEL: warning
  RELEASE_REVISION: ${RELEASE_SHA:?RELEASE_SHA is required}

x-staging-service: &staging-service
  image: ${APP_IMAGE:?APP_IMAGE must be an immutable GHCR tag@digest}
  build: !reset null
  env_file: !reset []
  environment: *staging-environment
  volumes:
    - staging_storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  security_opt: !override
    - no-new-privileges:true
  cap_drop: !override
    - ALL

services:
  app:
    <<: *staging-service
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}

  public-assets:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable GHCR tag@digest}
    build: !reset null
    env_file: !reset []
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        find /export -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + &&
        cp -a /var/www/html/public/. /export/ &&
        chmod -R a=rX /export
    volumes:
      - staging_public_assets:/export
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    ports: !override
      - "127.0.0.1:${APP_ORIGIN_PORT:-8081}:8080"
    volumes: !override
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_public_assets:/var/www/html/public:ro
    depends_on:
      public-assets:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  mysql:
    environment:
      MYSQL_DATABASE: ${STAGING_DB_DATABASE:-laraveldji_staging_restore}
      MYSQL_USER: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME is required}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${STAGING_MYSQL_ROOT_PASSWORD:?STAGING_MYSQL_ROOT_PASSWORD is required}
    ports: !reset []
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1 --user=root
          --execute='SELECT 1' --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes: !override
      - staging_mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1280M}

  redis:
    ports: !reset []
    volumes: !override
      - staging_redis_data:/data
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M}

  queue:
    <<: *staging-service
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=330 --memory=256 --max-jobs=250 --max-time=3600
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}

  scheduler:
    <<: *staging-service
    command: php artisan schedule:work
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}

  horizon:
    <<: *staging-service
    command: php artisan horizon
    profiles: [horizon-only]

  reverb:
    <<: *staging-service
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    profiles: [reverb]
    ports: !reset []

  mailpit:
    profiles: [development-only]

volumes:
  staging_mysql_data:
    name: laraveldji_staging_mysql_data
  staging_redis_data:
    name: laraveldji_staging_redis_data
  staging_storage:
    name: laraveldji_staging_storage
  staging_public_assets:
    name: laraveldji_staging_public_assets
