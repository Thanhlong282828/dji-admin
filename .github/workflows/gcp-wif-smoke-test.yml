name: GCP WIF Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-permission-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/379534698416/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'github-deployer@project-06b7a0c7-35a4-4282-b81.iam.gserviceaccount.com'
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Audit remote deploy permissions
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016 # Preserve expansion for the remote shell.
          gcloud compute ssh 'laravel-server'             --project='project-06b7a0c7-35a4-4282-b81'             --zone='asia-southeast1-a'             --tunnel-through-iap             --quiet             --command='
              set -eu

              echo "REMOTE_CONNECTION=PASS"

              echo
              echo "identity:"
              whoami
              id

              echo
              echo "repo_directory:"
              stat -c "owner=%U group=%G mode=%A path=%n" /var/www/laravel

              echo
              echo "git_directory:"
              stat -c "owner=%U group=%G mode=%A path=%n" /var/www/laravel/.git

              echo
              echo "git_fetch_head:"
              if [ -e /var/www/laravel/.git/FETCH_HEAD ]; then
                  stat -c "owner=%U group=%G mode=%A path=%n" /var/www/laravel/.git/FETCH_HEAD
              else
                  echo "FETCH_HEAD=ABSENT"
              fi

              echo
              echo "write_permission_checks:"
              if [ -w /var/www/laravel ]; then
                  echo "repo_write=YES"
              else
                  echo "repo_write=NO"
              fi

              if [ -w /var/www/laravel/.git ]; then
                  echo "git_dir_write=YES"
              else
                  echo "git_dir_write=NO"
              fi

              if [ -e /var/www/laravel/.git/FETCH_HEAD ] && [ -w /var/www/laravel/.git/FETCH_HEAD ]; then
                  echo "fetch_head_write=YES"
              else
                  echo "fetch_head_write=NO"
              fi

              echo
              echo "laravel_runtime_directories:"
              for p in                   /var/www/laravel/storage                   /var/www/laravel/storage/logs                   /var/www/laravel/bootstrap/cache
              do
                  if [ -e "$p" ]; then
                      stat -c "owner=%U group=%G mode=%A path=%n" "$p"
                      if [ -w "$p" ]; then
                          echo "writable=YES"
                      else
                          echo "writable=NO"
                      fi
                  fi
              done

              echo
              echo "docker:"
              if command -v docker >/dev/null 2>&1; then
                  docker --version || true
              else
                  echo "docker=NOT_INSTALLED"
              fi

              echo
              echo "service_status_read_only:"
              systemctl is-active nginx || true
              systemctl is-active php8.4-fpm || true
              systemctl is-active laravel-queue.service || true
              systemctl is-active laravel-reverb.service || true
              systemctl is-active laravel-scheduler.timer || true

              echo
              echo "repo_read:"
              git -C /var/www/laravel rev-parse HEAD || true
              git -C /var/www/laravel branch --show-current || true

              echo
              echo "AUDIT_COMPLETE=PASS"
             '

      - name: Final result
        shell: bash
        run: |
          echo "6.2H DEPLOY PERMISSION AUDIT = PASS"
          echo "No sudo command executed."
          echo "No write test executed."
          echo "No git fetch/pull executed."
          echo "No deployment performed."
          echo "No service restarted."
          echo "No database operation performed."
