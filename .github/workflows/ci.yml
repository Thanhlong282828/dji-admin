name: Admin CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Optional deployment target
        required: false
        type: choice
        default: build-only
        options: [build-only, development, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    environment: testing
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schema_admin_testing
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: schema_admin_testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: pcov}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan optimize:clear
      - run: php artisan migrate --force
      - run: npm ci && npm run build
      - name: Test environment preflight
        run: php artisan operations:test-readiness
      - name: Orphan process preflight
        run: scripts/ci/check-test-processes.sh
      - run: vendor/bin/pint --test
      - name: PHPStan Level 10 (no result cache)
        run: vendor/bin/phpstan analyse app Modules --level=10 --no-progress --memory-limit=2G --debug
      - run: vendor/bin/phpstan analyse tests/Unit/Operations tests/Unit/Architecture tests/Unit/ApiContract tests/Contract tests/Feature/ReleaseGovernanceTest.php tests/Feature/OperationsArchitectureTest.php tests/Feature/OperationsApiContractsTest.php --level=10 --no-progress --memory-limit=1G
      - name: Early architecture and test-governance fitness gate
        run: php artisan test tests/Unit/Architecture tests/Unit/Operations/TestQualityGovernanceTest.php tests/Feature/OperationsArchitectureTest.php tests/Feature/OperationsTestQualityTest.php
      - name: API contract gate
        run: php artisan l5-swagger:generate && php artisan operations:api-contract-audit && php artisan test tests/Unit/ApiContract tests/Contract tests/Feature/OperationsApiContractsTest.php tests/Feature/ApiDocumentationTest.php
      - name: Redis permission-cache integration gate
        env:
          CACHE_STORE: redis
          QUEUE_CONNECTION: sync
          REDIS_DB: 13
          REDIS_CACHE_DB: 14
          REDIS_PREFIX: laraveldji-ci-permission-${{ github.run_id }}-
        run: php artisan test tests/Feature/PermissionCacheIsolationTest.php
      - name: Serial process-concurrency gate
        run: php artisan test tests/Concurrency
      - name: Full PHPUnit Coverage
        id: full-coverage
        env:
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: |
          coverage_config=.phpunit.coverage-ci.xml
          coverage_data=vendor/nunomaduro/collision/.temp/coverage
          coverage_dir=build/coverage
          coverage_clover="$coverage_dir/clover.xml"
          coverage_summary="$coverage_dir/summary.json"
          test ! -e "$coverage_config"
          test ! -e "$coverage_data"
          trap 'rm -f "$coverage_config" "$coverage_data" "$coverage_clover"' EXIT
          grep -Fq '<ini name="memory_limit" value="512M"/>' phpunit.xml
          sed 's#<ini name="memory_limit" value="512M"/>#<ini name="memory_limit" value="1G"/>#' phpunit.xml > "$coverage_config"
          grep -Fq '<ini name="memory_limit" value="1G"/>' "$coverage_config"
          mkdir -p "$(dirname "$coverage_data")" "$coverage_dir"
          set +e
          php -d memory_limit=1G vendor/bin/phpunit --configuration="$coverage_config" --coverage-php="$coverage_data" --coverage-clover="$coverage_clover" --display-phpunit-notices --display-notices
          test_status=$?
          php scripts/ci/summarize-coverage.php "$coverage_clover" "$coverage_summary" --min=20
          coverage_status=$?
          # PHP variables must not be expanded by the shell.
          # shellcheck disable=SC2016
          php -d memory_limit=1G -r 'require "vendor/autoload.php"; NunoMaduro\Collision\Coverage::report(new Symfony\Component\Console\Output\ConsoleOutput(), true);'
          collision_status=$?
          set -e
          test "$test_status" -eq 0
          test "$coverage_status" -eq 0
          test "$collision_status" -eq 0
      - name: Upload safe coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-inventory-${{ github.sha }}
          path: build/coverage/summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Orphan process postflight
        if: always()
        run: scripts/ci/check-test-processes.sh
      - run: php artisan view:clear && php artisan view:cache && php artisan view:clear
      - run: composer audit --no-interaction
      - run: npm audit --omit=dev --audit-level=high
      - run: scripts/ci/scan-secrets.sh
      - run: scripts/ci/validate-pipeline.sh
      - run: php artisan operations:migration-risk
      - run: php artisan optimize
      - name: Readiness smoke test
        run: php artisan serve --host=127.0.0.1 --port=8000 & server=$!; trap 'kill $server' EXIT; for _ in {1..12}; do curl --fail http://127.0.0.1:8000/health/ready && exit 0; sleep 2; done; exit 1

  docker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.31.0
        with: {image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1'}

  deploy-development:
    if: github.ref == 'refs/heads/develop' || inputs.deploy_environment == 'development'
    needs: docker
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CONTAINER_IMAGE: ghcr.io/${{ github.repository }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          PREVIOUS_APP_IMAGE: ${{ vars.PREVIOUS_APP_IMAGE }}
          QUALITY_EVIDENCE_REFERENCE: ci://github-actions/${{ github.run_id }}
          BACKUP_REFERENCE: ${{ vars.BACKUP_READINESS_REFERENCE }}
          RELEASE_TAG: ${{ github.ref_name }}
          APPROVAL_REFERENCE: github-environment/development/${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,CONTAINER_IMAGE,DEPLOY_HEALTH_URL,IMAGE_DIGEST,PREVIOUS_APP_IMAGE,QUALITY_EVIDENCE_REFERENCE,BACKUP_REFERENCE,RELEASE_TAG,APPROVAL_REFERENCE
          script: cd "$DEPLOY_PATH" && scripts/deploy/release.sh development ${{ github.sha }}

  deploy-production:
    if: github.ref == 'refs/heads/main' || inputs.deploy_environment == 'production'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CONTAINER_IMAGE: ghcr.io/${{ github.repository }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          PREVIOUS_APP_IMAGE: ${{ vars.PREVIOUS_APP_IMAGE }}
          QUALITY_EVIDENCE_REFERENCE: ci://github-actions/${{ github.run_id }}
          BACKUP_REFERENCE: ${{ vars.BACKUP_READINESS_REFERENCE }}
          RELEASE_TAG: ${{ github.ref_name }}
          APPROVAL_REFERENCE: github-environment/production/${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,CONTAINER_IMAGE,DEPLOY_HEALTH_URL,IMAGE_DIGEST,PREVIOUS_APP_IMAGE,QUALITY_EVIDENCE_REFERENCE,BACKUP_REFERENCE,RELEASE_TAG,APPROVAL_REFERENCE
          script: cd "$DEPLOY_PATH" && scripts/deploy/release.sh production ${{ github.sha }}
